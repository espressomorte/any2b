name: Regression tests

on:
  schedule:
    - cron: '0 6 * * *'
      timezone: Europe/Warsaw
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  check_changes:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}

    steps:
      - name: Check for commits since the last successful run
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" != "schedule" ]]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          previous_sha="$(gh api \
            "repos/$GITHUB_REPOSITORY/actions/workflows/regression-tests.yml/runs" \
            --method GET \
            -f "branch=$GITHUB_REF_NAME" \
            -f "status=success" \
            -F "per_page=1" \
            --jq '.workflow_runs[0].head_sha // ""')"

          if [[ "$previous_sha" == "$GITHUB_SHA" ]]; then
            echo "No new commits since the last successful regression run."
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          fi

  test:
    needs: check_changes
    if: ${{ needs.check_changes.outputs.should_run == 'true' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false

      - name: Install Android packages
        run: sdkmanager "platforms;android-35" "build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run regression tests and build debug APK
        run: ./gradlew --no-daemon --max-workers=2 :core:test :tv-player:assembleDebug
