name: Android APK

on:
  push:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing release tag, e.g. v0.1.0-alpha.1'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false

      - name: Install Android packages
        run: sdkmanager "platforms;android-35" "build-tools;34.0.0"

      - name: Restore release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/keystore"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/keystore/release.jks"
          ls -l "$RUNNER_TEMP/keystore/release.jks"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/keystore/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          RELEASE_TAG: ${{ inputs.release_tag || github.event.release.tag_name }}
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          if [[ -z "$RELEASE_TAG" && "$GITHUB_REF_TYPE" == "tag" ]]; then
            RELEASE_TAG="$GITHUB_REF_NAME"
          fi
          gradle_args=("-PappVersionCode=$GITHUB_RUN_NUMBER")
          if [[ -n "$RELEASE_TAG" ]]; then
            gradle_args+=("-PappVersionName=${RELEASE_TAG#v}")
          fi
          ./gradlew \
            "-Dorg.gradle.java.home=$JAVA_HOME" \
            --no-daemon --max-workers=2 \
            "${gradle_args[@]}" \
            :core:test :tv-player:assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: any2b-release
          path: tv-player/build/outputs/apk/release/tv-player-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload APK to GitHub Release
        if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || github.event.release.tag_name }}
        shell: bash
        run: |
          set -euo pipefail
          gh release upload "$RELEASE_TAG" \
            tv-player/build/outputs/apk/release/tv-player-release.apk \
            --clobber
