<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AniList · AniTube — перегляд зіставлень</title>
  <style>
    :root{color-scheme:dark;--bg:#111218;--panel:#1b1d26;--line:#30323e;--muted:#a1a3b4;--text:#f2f1f8;--purple:#b6a7ff;--green:#74d6a5;--yellow:#f2c66d;--red:#f08d96}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,sans-serif}button,input,select,textarea{font:inherit;color:inherit}button,select,input[type=search],textarea{background:#252733;border:1px solid #414351;border-radius:10px;padding:9px 12px}button{cursor:pointer}button:hover{border-color:var(--purple)}a{color:var(--purple)}header{padding:25px max(20px,calc((100vw - 1440px)/2));border-bottom:1px solid var(--line);background:#171820}h1{font-size:22px;margin:0 0 4px}header p{margin:0;color:var(--muted)}main{max-width:1440px;margin:auto;padding:20px;display:grid;gap:16px}.toolbar,.stats,.layout{display:flex;gap:12px;align-items:center}.toolbar{flex-wrap:wrap}.toolbar .spacer{flex:1}.stats{flex-wrap:wrap}.stat{padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--muted)}.stat b{color:var(--text);margin-right:5px}.layout{align-items:stretch}.list{width:43%;min-width:330px;max-height:calc(100vh - 245px);overflow:auto;border:1px solid var(--line);border-radius:12px;background:var(--panel)}.row{width:100%;text-align:left;display:block;padding:13px 15px;border:0;border-bottom:1px solid var(--line);border-radius:0;background:transparent}.row:hover,.row.active{background:#282936}.row strong{display:block;font-size:15px;margin:5px 0}.meta{font-size:12px;color:var(--muted)}.badge{font-size:11px;border-radius:99px;padding:3px 8px;background:#292b35;color:var(--muted)}.badge.matched{color:var(--green);background:#173127}.badge.needs_review{color:var(--yellow);background:#3a3020}.badge.not_found{color:var(--red);background:#382329}.detail{flex:1;min-width:0;padding:20px;border:1px solid var(--line);border-radius:12px;background:var(--panel);max-height:calc(100vh - 245px);overflow:auto}.detail h2{font-size:21px;margin:0 0 4px}.detail h3{font-size:15px;margin:20px 0 8px}.detailhead{display:flex;justify-content:space-between;gap:14px}.reason{margin:14px 0;padding:11px 13px;background:#242631;border-radius:9px;color:#d1d0dc}.facts{display:flex;gap:8px;flex-wrap:wrap;color:var(--muted);font-size:13px}.candidate{border:1px solid var(--line);border-radius:10px;padding:13px;margin:9px 0}.candidate h4{margin:0 0 4px;font-size:16px}.candidate p{margin:3px 0;color:var(--muted)}.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}.tag{font-size:11px;color:#d5d3df;background:#30323d;border-radius:6px;padding:3px 7px}.empty{padding:32px;color:var(--muted);text-align:center}.load{border:1px dashed #545668;border-radius:12px;padding:16px;color:var(--muted)}.load input{max-width:100%}.error{color:var(--red)}.review-tools{margin:20px 0;padding:14px;border:1px solid var(--line);border-radius:10px}.review-tools label{display:block;margin-bottom:7px;font-weight:600}.review-tools textarea{width:100%;min-height:82px;resize:vertical}.review-tools small{display:block;color:var(--muted);margin-top:5px}.reject,.confirm-candidate{font-size:12px;padding:5px 9px;margin:8px 6px 0 0}.reject[aria-pressed=true]{color:#ffc1c3;background:#39252b;border-color:#88525a}.confirm-candidate[aria-pressed=true]{color:#a8f0c9;background:#153c2e;border-color:#388b65}.candidate.rejected{opacity:.62}.candidate.rejected h4{text-decoration:line-through}.candidate.confirmed{border-color:#388b65}.@media(max-width:800px){.layout{display:block}.list{width:100%;min-width:0;max-height:40vh;margin-bottom:12px}.detail{max-height:none}.stats{gap:6px}}
    .romaji-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.verify-result{display:block;min-height:1.4em;color:var(--muted);font-size:12px}.verify-result.success{color:var(--green)}.verify-result.error{color:var(--red)}.verify-anitube{font-size:12px;padding:5px 9px}button:disabled{opacity:.55;cursor:wait}
  </style>
</head>
<body>
  <header><h1>AniList × TMDB × AniTube</h1><p>Перегляд результатів автоматичного зіставлення · для перевірки кандидата відкрийте через <code>python3 total-matcher/review_server.py</code></p></header>
  <main>
    <div class="load"><label>Відкрити JSON зіставлень: <input id="file" type="file" accept="application/json,.json"></label> <span id="filename">Оберіть <code>anilistTmbdbAnitube.json</code></span></div>
    <section class="stats" id="stats"></section>
    <section class="toolbar"><select id="status"><option value="all">Усі статуси</option><option value="matched">Успішно зіставлено</option><option value="needs_review">Потребує перевірки</option><option value="not_found">Не знайдено</option></select><input id="query" type="search" placeholder="Пошук за назвою або ID"><button id="export" disabled>Експортувати перевірки</button><span class="spacer"></span><span class="meta" id="shown"></span></section>
    <div class="layout"><section class="list" id="list"><div class="empty">Завантажте JSON-файл, щоб побачити записи.</div></section><article class="detail" id="detail"><div class="empty">Оберіть запис зі списку.</div></article></div>
  </main>
<script>
const $=id=>document.getElementById(id);
let records=[],visible=[],selected=-1,sourceMeta={};
const STORAGE='anilist-review-notes-v1';
let notes=readNotes();
const labels={matched:'Успішно зіставлено',needs_review:'Потребує перевірки',not_found:'Не знайдено'};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function readNotes(){try{return JSON.parse(localStorage.getItem(STORAGE)||'{}')}catch{return {}}}
function key(x){return String(x.newsId??x.anitubeUrl??x.anitubeTitle)}
function noteFor(x){
  const n=notes[key(x)]||(notes[key(x)]={comment:'',rejected:[],confirmed:[]});
  n.comment??='';n.rejected??=[];
  if(Array.isArray(n.confirmed)){}else if(Number.isInteger(n.confirmed))n.confirmed=[n.confirmed];else n.confirmed=[];
  return n;
}
function saveNotes(){localStorage.setItem(STORAGE,JSON.stringify(notes))}
function load(data,name){
  if(!data||!Array.isArray(data.items))throw Error('У файлі немає масиву items.');
  records=data.items;sourceMeta=data.$meta||{};
  records.forEach(x=>{
    const r=x.userReview;if(!r)return;const n=noteFor(x);
    if(r.comment)n.comment=r.comment;
    if(Array.isArray(r.rejectedCandidateIndexes))n.rejected=r.rejectedCandidateIndexes;
    const confirmed=Array.isArray(r.confirmedCandidates)?r.confirmedCandidates:
      (r.confirmedCandidate?[r.confirmedCandidate]:[]);
    if(confirmed.length){n.confirmed=confirmed.map(c=>c.index).filter(Number.isInteger);n.verified??={};confirmed.forEach(c=>{if(Number.isInteger(c.index)&&c.anitubeSearchVerification)n.verified[c.index]=c.anitubeSearchVerification})}
  });
  saveNotes();selected=-1;$('export').disabled=false;
  $('filename').textContent=`${name} · ${records.length.toLocaleString('uk-UA')} записів`;
  renderStats();filter();
}
function renderStats(){
  const counts=records.reduce((a,x)=>(a[x.status]=(a[x.status]||0)+1,a),{});
  $('stats').innerHTML=`<span class="stat"><b>${(sourceMeta.processedCount??records.length).toLocaleString('uk-UA')}</b> оброблено</span>`+
    Object.entries(labels).map(([k,v])=>`<span class="stat"><b>${(counts[k]||0).toLocaleString('uk-UA')}</b> ${v}</span>`).join('')+
    `<span class="stat">Завершено: ${sourceMeta.complete?'так':'ні'}</span>`;
}
function filter(){
  const s=$('status').value,q=$('query').value.trim().toLocaleLowerCase('uk');
  visible=records.map((x,i)=>({x,i})).filter(({x})=>(s==='all'||x.status===s)&&
    (!q||[x.anitubeTitle,x.newsId,x.year,x.reason,...(x.candidates||[]).flatMap(c=>[c.anilistTitle,c.anilistRomaji,c.tmdbTitle,c.anilistId,c.tmdbId])].join(' ').toLocaleLowerCase('uk').includes(q)));
  $('shown').textContent=`${visible.length.toLocaleString('uk-UA')} записів`;
  $('list').innerHTML=visible.length?visible.map(({x,i})=>`<button class="row ${i===selected?'active':''}" data-i="${i}"><span class="badge ${esc(x.status)}">${esc(labels[x.status]||x.status)}</span><strong>${esc(x.anitubeTitle||'Без назви')}</strong><span class="meta">AniTube #${esc(x.newsId)} · ${esc(x.year||'рік невідомий')} · ${x.candidates?.length||0} кандидатів</span></button>`).join(''):'<div class="empty">За цим фільтром записів немає.</div>';
  document.querySelectorAll('.row').forEach(b=>b.onclick=()=>{selected=+b.dataset.i;filter();renderDetail(records[selected])});
  if(selected<0&&visible.length){selected=visible[0].i;filter();renderDetail(records[selected])}
  else if(selected>=0&&!visible.some(z=>z.i===selected)){$('detail').innerHTML='<div class="empty">Оберіть запис зі списку.</div>';selected=-1}
}
function candidateSnapshot(c,index,verification=null){return {index,anilistId:c.anilistId??null,tmdbId:c.tmdbId??null,tmdbType:c.tmdbType??null,tmdbSeason:c.tmdbSeason??null,anilistTitle:c.anilistTitle??null,anilistRomaji:c.anilistRomaji??null,tmdbTitle:c.tmdbTitle??null,...(verification?{anitubeSearchVerification:verification}:{})}}
function renderDetail(x){
  const candidates=x.candidates||[],n=noteFor(x);
  $('detail').innerHTML=`<div class="detailhead"><div><h2>${esc(x.anitubeTitle||'Без назви')}</h2><div class="facts">AniTube #${esc(x.newsId)} · ${esc(x.year||'рік невідомий')} · ${esc(x.episodes||'—')} серій</div></div><span class="badge ${esc(x.status)}">${esc(labels[x.status]||x.status)}</span></div>
  <div class="facts" style="margin-top:9px"><a href="${esc(x.anitubeUrl||'#')}" target="_blank" rel="noopener">Відкрити AniTube ↗</a></div><div class="reason">${esc(x.reason||'Причина не вказана')}</div>
  <section class="review-tools"><label for="comment">Службовий коментар: що перевірити</label><textarea id="comment" placeholder="Можна додати кілька AniList URL, якщо реліз об’єднує сезони">${esc(n.comment)}</textarea><small id="saved">Коментар зберігається в цьому браузері</small></section>
  <section class="review-tools"><label for="anilist-link">Перевірити посилання AniList</label><div class="romaji-row"><input id="anilist-link" type="url" placeholder="https://anilist.co/anime/12345/" style="flex:1;min-width:240px"><button id="add-anilist">Перевірити й додати</button></div><small id="anilist-link-result">Після додавання зв’язок з AniList буде підтверджений; TMDB можна знайти повторним аналізом.</small></section>
  <h3>Кандидати (${candidates.length})</h3>${candidates.length?candidates.map((c,i)=>{
    const e=c.evidence||{},rejected=n.rejected.includes(i),confirmed=n.confirmed.includes(i),verification=n.verified?.[i];
    return `<section class="candidate ${rejected?'rejected':''} ${confirmed?'confirmed':''}"><h4>${i+1}. ${esc(c.anilistTitle||c.tmdbTitle||'Кандидат без назви')} ${rejected?'<span class="badge not_found">Відхилено</span>':''} ${confirmed?'<span class="badge matched">Підтверджено вами</span>':''}</h4>
    ${c.anilistRomaji?`<p class="romaji-row"><span>Ромадзі (AniList): ${esc(c.anilistRomaji)}</span><button class="verify-anitube" data-candidate="${i}" ${verification?'disabled':''}>${verification?'Перевірено AniTube':'Перевірити'}</button></p><small id="verify-result-${i}" class="verify-result ${verification?'success':''}">${verification?`Знайдено той самий реліз: AniTube #${esc(verification.newsId)} · ${esc(verification.title)}`:''}</small>`:`<p>Ромадзі (AniList): не вказано</p>`}<p>${c.anilistId?`AniList <a target="_blank" rel="noopener" href="https://anilist.co/anime/${esc(c.anilistId)}">#${esc(c.anilistId)} ↗</a>`:''}${c.tmdbId?` · TMDB ${esc(c.tmdbType||'')} <a target="_blank" rel="noopener" href="https://www.themoviedb.org/${c.tmdbType==='movie'?'movie':'tv'}/${esc(c.tmdbId)}">#${esc(c.tmdbId)} ↗</a>`:''}</p>
    <div class="facts">${[c.anilistFormat&&`Формат ${c.anilistFormat}`,c.anilistYear&&`AniList ${c.anilistYear}`,c.tmdbYear&&`TMDB ${c.tmdbYear}`,c.tmdbSeason!=null&&`Сезон TMDB ${c.tmdbSeason}`,c.tmdbSeasonYear&&`Рік сезону ${c.tmdbSeasonYear}`,c.anilistEpisodes&&`AniList серій ${c.anilistEpisodes}`,c.tmdbSeasonEpisodes&&`TMDB серій ${c.tmdbSeasonEpisodes}`,c.matchScore!=null&&`Оцінка ${c.matchScore}`,c.mappingSource&&`Джерело ${c.mappingSource}`,confirmed&&!c.tmdbId&&'TMDB: очікує зіставлення'].filter(Boolean).map(esc).join(' · ')}</div>
    ${c.tmdbSeasons?.length?`<p>Сезони TMDB: ${c.tmdbSeasons.map(s=>`${s.number} (${s.year||'—'}, ${s.episodes||'?'} еп.)`).map(esc).join(' · ')}</p>`:''}${c.episodeMappings?.length?`<p>Епізоди: ${c.episodeMappings.map(m=>`${m.sourceRange} → ${m.targetRange}`).map(esc).join(' · ')}</p>`:''}
    <div class="tags">${Object.entries(e).map(([k,v])=>`<span class="tag">${esc(k)}: ${typeof v==='boolean'?(v?'так':'ні'):esc(v)}</span>`).join('')}</div>
    ${x.status==='needs_review'||confirmed?`<button class="confirm-candidate" data-candidate="${i}" aria-pressed="${confirmed}">${confirmed?'Зняти підтвердження':'Підтвердити кандидата'}</button>`:''}<button class="reject" data-candidate="${i}" aria-pressed="${rejected}">${rejected?'Повернути кандидата':'Відхилити кандидата'}</button></section>`
  }).join(''):'<p class="meta">Кандидатів немає.</p>'}`;
  $('comment').oninput=e=>{n.comment=e.target.value;saveNotes();$('saved').textContent='Збережено'};
  $('add-anilist').onclick=async()=>{
    const button=$('add-anilist'),result=$('anilist-link-result'),input=$('anilist-link');
    const match=input.value.trim().match(/^https?:\/\/(?:www\.)?anilist\.co\/anime\/(\d+)(?:\/|\?|#|$)/i);
    if(!match){result.textContent='Вставте посилання вигляду https://anilist.co/anime/12345/';return}
    button.disabled=true;result.textContent='Перевіряю AniList…';
    try{
      const response=await fetch(`/api/anilist/anime?id=${match[1]}`);
      if(!response.ok){
        const details=response.headers.get('content-type')?.includes('application/json')?await response.json():null;
        if(response.status===404&&!details)throw Error('локальний сервер працює зі старою версією; зупиніть його та запустіть review_server.py знову');
        throw Error(details?.error||`AniList відповів HTTP ${response.status}`);
      }
      const anime=await response.json();if(Number(anime.id)!==Number(match[1]))throw Error('AniList ID не збігається');
      x.candidates??=[];let i=x.candidates.findIndex(c=>Number(c.anilistId)===anime.id);
      if(i<0){const title=anime.title||{};i=x.candidates.push({anilistId:anime.id,anilistTitle:title.english||title.romaji||title.native||`AniList #${anime.id}`,anilistRomaji:title.romaji||null,anilistEnglish:title.english||null,anilistYear:anime.seasonYear||null,anilistEpisodes:anime.episodes||null,anilistFormat:anime.format||null,tmdbId:null,tmdbType:null,tmdbPending:true,mappingSource:'manual_anilist_url',manualConfirmation:true})-1}
      if(!n.confirmed.includes(i))n.confirmed.push(i);n.rejected=n.rejected.filter(v=>v!==i);
      const link=anime.siteUrl||`https://anilist.co/anime/${anime.id}/`;
      if(!n.comment.includes(link))n.comment=[n.comment,link].filter(Boolean).join('\n');
      x.status='matched';x.reason=x.candidates[i].tmdbId?'AniList підтверджено вручну':'AniList підтверджено вручну; TMDB очікує зіставлення';saveNotes();renderStats();$('status').value='matched';filter();renderDetail(x);
    }catch(error){result.textContent=`Не вдалося додати: ${error.message}`;button.disabled=false}
  };
  document.querySelectorAll('.reject').forEach(b=>b.onclick=()=>{const i=+b.dataset.candidate;n.rejected.includes(i)?n.rejected=n.rejected.filter(v=>v!==i):n.rejected.push(i);n.confirmed=n.confirmed.filter(v=>v!==i);saveNotes();renderDetail(x)});
  document.querySelectorAll('.confirm-candidate').forEach(b=>b.onclick=()=>{const i=+b.dataset.candidate;n.confirmed.includes(i)?n.confirmed=n.confirmed.filter(v=>v!==i):n.confirmed.push(i);n.rejected=n.rejected.filter(v=>v!==i);saveNotes();renderDetail(x)});
  document.querySelectorAll('.verify-anitube').forEach(b=>b.onclick=async()=>{
    const i=+b.dataset.candidate,c=candidates[i],status=$(`verify-result-${i}`);
    b.disabled=true;b.textContent='Шукаю…';status.className='verify-result';status.textContent='Пошук на AniTube за ромаджі…';
    try{
      const response=await fetch(`/api/anitube/search?query=${encodeURIComponent(c.anilistRomaji)}`);
      if(!response.ok)throw Error(`AniTube API відповів HTTP ${response.status}`);
      const results=await response.json(),expectedId=Number(x.newsId)||Number((x.anitubeUrl||'').match(/\/(\d+)-/)?.[1]);
      const hit=results.find(r=>Number(r.newsId)===expectedId&&Number((r.pageUrl||'').match(/\/(\d+)-/)?.[1])===expectedId);
      if(!hit){status.className='verify-result error';status.textContent=`Знайдено ${results.length} результатів, але серед них немає шуканого AniTube-релізу #${expectedId}. Кандидата не підтверджено.`;b.disabled=false;b.textContent='Перевірити ще раз';return}
      n.verified??={};n.verified[i]={newsId:hit.newsId,title:hit.title,pageUrl:hit.pageUrl,query:c.anilistRomaji,verifiedAt:new Date().toISOString()};
      if(!n.confirmed.includes(i))n.confirmed.push(i);n.rejected=n.rejected.filter(v=>v!==i);x.status='matched';saveNotes();renderStats();$('status').value='matched';filter();renderDetail(x);
    }catch(err){status.className='verify-result error';status.textContent=`Не вдалося перевірити: ${err.message}. Відкрийте сторінку через локальний review_server.py.`;b.disabled=false;b.textContent='Спробувати ще раз'}
  });
}
$('file').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{load(JSON.parse(await f.text()),f.name)}catch(err){$('filename').innerHTML=`<span class="error">${esc(err.message)}</span>`}};
$('status').onchange=filter;$('query').oninput=filter;
$('export').onclick=()=>{
  const out={$meta:{...sourceMeta,reviewExportedAt:new Date().toISOString()},items:records.map(x=>{
    const n=noteFor(x),confirmed=n.confirmed.map(i=>candidateSnapshot(x.candidates?.[i]||{},i,n.verified?.[i]||null));
    if(!n.comment&&!n.rejected.length&&!confirmed.length)return x;
    return {...x,userReview:{comment:n.comment,rejectedCandidateIndexes:n.rejected,confirmedCandidates:confirmed,confirmedCandidate:confirmed.length===1?confirmed[0]:null}};
  })};
  const blob=new Blob([JSON.stringify(out,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='anilistTmbdbAnitube-reviewed.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);
};
</script>
</body></html>
